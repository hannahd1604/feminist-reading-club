---
layout: default
---
<style>
:root {
  --g:   #fdf5f7;
  --t:   #2a1f0e;
  --m:   #5a4e40;
  --ru:  #e0d4e8;
  --pu:  #4a1f6a;
  --pum: #7040a0;
  --gr:  #1e3d22;
}
body {
  background: var(--g);
  background-image: repeating-linear-gradient(
    transparent 0px, transparent 30px,
    rgba(74,31,106,0.04) 30px, rgba(74,31,106,0.04) 31px
  );
  color: var(--t);
  font-family: 'Calibri', system-ui, sans-serif;
}

/* ─── Masthead ──────────────────────────────────── */
.book-masthead {
  background: var(--pu);
  background-image: repeating-linear-gradient(
    transparent 0px, transparent 30px,
    rgba(255,255,255,0.04) 30px, rgba(255,255,255,0.04) 31px
  );
  padding: 2.8rem 3rem 2.4rem;
  border-bottom: 3px solid var(--gr);
  display: flex; align-items: center; gap: 2rem;
}
.book-masthead-img { width: 6rem; height: 6rem; flex-shrink: 0; }
.book-masthead-text .stamp {
  display: inline-block;
  border: 1.5px solid rgba(255,255,255,0.4);
  color: rgba(255,255,255,0.7);
  font-family: 'Courier New', Courier, monospace;
  font-size: 0.78rem; letter-spacing: 0.2em; text-transform: uppercase;
  padding: 0.2rem 0.7rem; margin-bottom: 1rem; transform: rotate(-1deg);
}
.book-masthead-text h1 {
  font-family: 'Courier New', Courier, monospace;
  font-size: clamp(1.6rem, 4vw, 2.6rem); font-weight: bold;
  color: #fff; line-height: 1.15; margin-bottom: 0.45rem;
}
.book-masthead-text .book-author {
  font-size: 1rem; color: rgba(255,255,255,0.8);
  font-style: italic; margin: 0;
}

/* ─── Back link ─────────────────────────────────── */
.book-back {
  max-width: 720px; margin: 0 auto; padding: 1.6rem 2rem 0;
}
.book-back a {
  font-family: 'Courier New', Courier, monospace;
  font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--pum); text-decoration: none;
}
.book-back a:hover { color: var(--pu); }

/* ─── Body ──────────────────────────────────────── */
.book-body {
  max-width: 720px; margin: 0 auto; padding: 1.8rem 2rem 5rem;
  font-size: 1.02rem; line-height: 1.75;
}
.book-body p { margin-bottom: 1.2rem; }
.book-body h2 {
  font-family: 'Courier New', Courier, monospace;
  font-size: 0.84rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--pum); margin-top: 2.4rem; margin-bottom: 0.7rem; font-weight: bold;
}
.book-body a { color: var(--gr); }
.book-body a:hover { color: var(--pum); }

/* ─── Links box ─────────────────────────────────── */
.book-links {
  background: rgba(74,31,106,0.04);
  border-left: 3px solid var(--pu);
  padding: 1rem 1.4rem; margin-top: 2rem;
}
.book-links ul { margin: 0; padding: 0; list-style: none; }
.book-links li { padding: 0.25rem 0; font-size: 0.95rem; }
.book-links li::before { content: '→ '; color: var(--pum); font-family: 'Courier New', monospace; }

/* ─── Comments ──────────────────────────────────── */
.book-comments { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--ru); }
.book-comments-label {
  font-family: 'Courier New', Courier, monospace;
  font-size: 0.82rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--pum); font-weight: bold; margin-bottom: 0.5rem;
}
.book-comments-note { font-size: 0.82rem; color: var(--m); margin-bottom: 1.2rem; font-style: italic; }
.cform { display: flex; flex-direction: column; gap: 0.85rem; }
.cform input, .cform textarea {
  font-family: 'Calibri', system-ui, sans-serif; font-size: 0.88rem;
  border: 1px solid var(--ru); border-radius: 2px;
  padding: 0.65rem 0.9rem; background: #fff; color: var(--t); width: 100%;
  transition: border-color .12s;
}
.cform input:focus, .cform textarea:focus { outline: none; border-color: var(--pum); }
.cform textarea { resize: vertical; min-height: 110px; line-height: 1.55; }
.cform button {
  align-self: flex-start;
  font-family: 'Courier New', Courier, monospace; font-size: 0.72rem;
  letter-spacing: 0.12em; text-transform: uppercase;
  background: var(--pu); color: #fff; border: none;
  padding: 0.7rem 1.4rem; cursor: pointer; border-radius: 2px;
  transition: background .12s; min-height: 44px;
}
.cform button:hover { background: var(--pum); }

@media (max-width: 700px) {
  .book-masthead { flex-direction: column; align-items: flex-start; gap: 1rem; padding: 2rem 1.4rem; }
  .book-masthead-img { width: 4.5rem; height: 4.5rem; }
  .book-back, .book-body { padding-left: 1.4rem; padding-right: 1.4rem; }
  .cform button { width: 100%; text-align: center; }
}
</style>

<div class="book-masthead">
  <img class="book-masthead-img" src="{{ '/assets/img/book.png' | relative_url }}" alt="">
  <div class="book-masthead-text">
    <div class="stamp">Book Club{% if page.date %} &middot; {{ page.date | date: "%B %Y" }}{% endif %}</div>
    <h1>{{ page.title }}</h1>
    <p class="book-author">{{ page.author }}{% if page.year %} &middot; {{ page.year }}{% endif %}</p>
  </div>
</div>

<div class="book-back">
  <a href="{{ '/books' | relative_url }}">← Book Club</a>
</div>

<div class="book-body">
  {{ content }}

  <div class="book-comments">
    <div class="book-comments-label">Leave a comment</div>
    <p class="book-comments-note">Comments are reviewed by the organisers before appearing here.</p>
    <form class="cform" action="https://submit.formspark.io/f/2x0lSx5iZ" method="POST">
      <input type="text" name="name" placeholder="Name (optional)">
      <input type="email" name="email" placeholder="Email (not shown publicly)" required>
      <input type="hidden" name="book" value="{{ page.title }}">
      <textarea name="message" placeholder="A thought, a recommendation, something the session brought up…"></textarea>
      <button type="submit">Submit</button>
    </form>
  </div>
</div>
